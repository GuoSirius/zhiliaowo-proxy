packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11：原生构建脚本白名单用 allowBuilds（map: 包名 → true/false）
# 替代已废弃的 onlyBuiltDependencies；解决安装的 ERR_PNPM_IGNORED_BUILDS
# （better-sqlite3 / esbuild / puppeteer / vue-demi 需要跑 install 脚本）
allowBuilds:
  better-sqlite3: true
  esbuild: true
  puppeteer: true
  vue-demi: true

# pnpm 10.26 之前的兼容写法（pnpm 11 会忽略并提示 deprecated，无副作用）
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - puppeteer
  - vue-demi

# 共享依赖版本目录（单一事实源）：各包用 "catalog:" 引用，
# 升级只需在此统一改一处，再跑 `pnpm up -r --latest` 即可全量更新。
catalog:
  # 类型 / 构建（全包共用）
  typescript: ^5.7.2
  # 钉到 ^24 匹配 Node 24 运行时（26.x 太新触发 minimumReleaseAge 策略拦截）
  "@types/node": ^24.0.0
  # 前端共用
  vue: ^3.5.13
  pinia: ^2.3.0
  vite: ^6.0.0
  "@vitejs/plugin-vue": ^5.2.0
  vue-tsc: ^2.1.10
  unocss: ^0.65.0
  # 提交 / 发布（根层工具）
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  changelogen: ^0.6.2
  husky: ^9.1.7
  # 共享层
  zod: ^3.23.8

minimumReleaseAgeExclude:
  - puppeteer-core@25.9.0
  - puppeteer@25.9.0
